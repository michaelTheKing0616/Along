# Along-specific Semgrep rules (doc 12, P11-E-01). Run in CI via .github/workflows/security.yml
rules:
  - id: along-pii-otp-in-logs
    message: >-
      OTP must never appear in logs (doc 12 §2). Remove otp/OTP from log payloads;
      use phone_suffix only for the sms log provider.
    severity: ERROR
    languages: [typescript, javascript]
    pattern-either:
      - pattern: |
          console.log(..., { ..., otp: $OTP, ... }, ...)
      # $LOG must be a logger call; otherwise any object literal with an otp
      # key (e.g. a zod schema) is flagged.
      - patterns:
          - pattern-either:
              - pattern: |
                  $LOG({ ..., otp: $OTP, ... })
              - pattern: |
                  $LOG({ ..., OTP: $OTP, ... })
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^(.*\.)?(log|info|warn|warning|error|debug|trace)$
    paths:
      exclude:
        - "**/*_test.ts"
        - "**/*_test.tsx"

  - id: along-pii-phone-in-logs
    message: >-
      Full phone numbers must not be logged (doc 12 T12). Log phone_suffix (last 4) only.
    severity: WARNING
    languages: [typescript, javascript, dart]
    patterns:
      - pattern-either:
          - pattern: |
              console.log(..., { ..., phone: $PHONE, ... }, ...)
          - pattern: |
              $LOG(..., { ..., phone: $PHONE, ... }, ...)
      - metavariable-regex:
          metavariable: $PHONE
          regex: ^(?!.*suffix).*$
    paths:
      exclude:
        - "**/*_test.ts"
        - "**/*_test.tsx"
        - "**/*_test.dart"

  - id: along-pii-plate-or-token-in-logs
    message: >-
      Plates and auth tokens must not appear in structured logs (doc 12 T12).
    severity: WARNING
    languages: [typescript, javascript, dart]
    pattern-either:
      - pattern: |
          console.log(..., { ..., plate: $X, ... }, ...)
      - pattern: |
          console.log(..., { ..., token: $X, ... }, ...)
      - pattern: |
          $LOG(..., { ..., plate: $X, ... }, ...)
      - pattern: |
          $LOG(..., { ..., token: $X, ... }, ...)
    paths:
      exclude:
        - "**/*_test.ts"
        - "**/*_test.tsx"
        - "**/*_test.dart"

  # Semgrep OSS has no SQL parser ("invalid language: sql"), so the SQL rules
  # below use the generic engine with regexes that encode the same checks.
  - id: along-postgres-current-user-bypass
    message: >-
      Column-protection trigger bypass via current_user postgres/supabase_admin.
      Allowed only inside protect_* triggers for migrations/service paths — verify
      search_path and that no client role can reach this branch.
    severity: WARNING
    languages: [generic]
    pattern-regex: (?i)current_user\s+in\s*\(\s*'postgres'\s*,\s*'supabase_admin'\s*\)
    paths:
      include:
        - "/backend/db/migrations/**"
        - "/backend/db/policies/**"

  - id: along-digital-enabled-migration-flip
    message: >-
      Do not set payments.digital_enabled to true in migrations (P4-E-02 / doc 11).
      Default stays false via config_default(); enable only via A-09 after counsel.
    severity: ERROR
    languages: [generic]
    pattern-either:
      - pattern-regex: (?is)update\s+app_config\s+set\s+value\s*=\s*'true'[^;]*payments\.digital_enabled
      - pattern-regex: (?is)insert\s+into\s+app_config\b[^;]*payments\.digital_enabled[^;]*'true'
      - pattern-regex: (?i)config_default\(\s*'payments\.digital_enabled'\s*,\s*'true'
    paths:
      include:
        - "/backend/db/migrations/**"
      exclude:
        - "**/*_test.sql"
        - "**/seed/**"

  - id: along-driver-presence-rider-select
    message: >-
      Riders must not have SELECT on driver_presence (doc 12 T1 / TS-DISC-01).
      Tier-A disclosure uses ambient_vehicles() only.
    severity: ERROR
    languages: [generic]
    pattern-regex: (?is)create\s+policy\s+\S+\s+on\s+(public\.)?driver_presence\s+for\s+select[^;]*(profiles\.role\s*=\s*'rider'|\(\s*select\s+role\s+from\s+profiles[^)]*\)\s*=\s*'rider')
    paths:
      include:
        - "/backend/db/policies/**"
        - "/backend/db/migrations/**"
