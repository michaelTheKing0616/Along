name: mobile

on:
  pull_request:
  push:
    branches: [master]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos 6.3.2

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Dart analyze
        run: melos exec -- dart analyze --fatal-infos

      - name: Install sqlite3 shared library (sqlite3 FFI in tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Dart test
        run: melos exec -- flutter test

      - name: Release APK analyze-size gate
        run: bash mobile-rider/scripts/check_release_build.sh

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos 6.3.2

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Prepare compile-only mobile env
        run: bash scripts/prepare_ci_mobile_env.sh

      - name: Prepare iOS Firebase plists
        run: bash scripts/prepare_ios_firebase.sh

      - name: Build rider iOS staging (no codesign)
        working-directory: mobile-rider
        run: flutter build ios --no-codesign --flavor staging --dart-define-from-file=env/staging.json

      - name: Build driver iOS staging (no codesign)
        working-directory: mobile-driver
        run: flutter build ios --no-codesign --flavor staging --dart-define-from-file=env/staging.json
