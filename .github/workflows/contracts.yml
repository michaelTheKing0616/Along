name: contracts

on:
  pull_request:
  push:
    branches: [master]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate OpenAPI 3.1
        run: pnpm --filter @along/contracts validate

      - name: Contract drift check (generated outputs)
        run: bash shared/contracts/scripts/check_stale.sh

      - name: Compile-check generated TS + Dart types
        run: bash shared/contracts/scripts/check_compile.sh
