name: db

on:
  pull_request:
  push:
    branches: [master]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_prove, psql and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtap-parser-sourcehandler-pgtap-perl postgresql-client ripgrep
          pg_prove --version

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start Supabase local stack
        run: supabase start

      - name: ADR-0016 app_config migration grep gate
        run: bash backend/db/scripts/check_app_config_migrations.sh

      - name: TS-CFG-02 (migrations only, no seed)
        run: bash backend/db/scripts/run_ts_cfg_02.sh

      - name: Apply migrations and seed on fresh DB
        run: supabase db reset --yes

      - name: Run pgTAP tests
        run: bash backend/db/scripts/run_pgtap.sh

      - name: Lint database
        run: supabase db lint

      - name: RLS coverage check
        run: bash backend/db/scripts/run_rls_coverage.sh

      - name: RLS policy snapshot check
        run: bash backend/db/scripts/check_policies_stale.sh

      - name: Authorization matrix check
        run: bash backend/db/scripts/check_authz_matrix.sh

      - name: Schema types contract check
        run: bash backend/db/scripts/check_schema_types.sh
