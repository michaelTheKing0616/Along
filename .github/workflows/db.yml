name: db

on:
  pull_request:
  push:
    branches: [master]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations on fresh DB
        run: supabase db reset --yes

      - name: Run pgTAP tests
        run: bash backend/db/scripts/run_pgtap.sh

      - name: Lint database
        run: supabase db lint

      - name: RLS coverage check
        run: bash backend/db/scripts/run_rls_coverage.sh

      - name: Schema types contract check
        run: bash backend/db/scripts/check_schema_types.sh
