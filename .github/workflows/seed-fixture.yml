name: seed-fixture

on:
  pull_request:
  push:
    branches: [master]

jobs:
  seed-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations on fresh DB
        run: supabase db reset --yes

      - name: Seed fixture and TS-CFG scenarios
        run: bash backend/db/scripts/check_seed_fixture.sh

      - name: Run TS-CFG-01 on Zaria-Test fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/tests/TS-CFG-01.sql
