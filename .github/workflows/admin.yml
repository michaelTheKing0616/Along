name: admin

on:
  pull_request:
  push:
    branches: [master]

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint admin-console
        run: pnpm --filter @along/admin-console lint

      - name: Typecheck admin-console
        run: pnpm --filter @along/admin-console typecheck

      - name: Test admin-console
        run: pnpm --filter @along/admin-console test

      - name: Playwright E2E against local stack
        run: bash admin-console/scripts/check_playwright.sh
