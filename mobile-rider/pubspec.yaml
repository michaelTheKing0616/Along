name: mobile_rider
description: Along rider app (Flutter).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  along_core:
    path: ../shared/flutter/along_core
  along_data:
    path: ../shared/flutter/along_data
  along_design:
    path: ../shared/flutter/along_design
  along_location:
    path: ../shared/flutter/along_location
  along_map:
    path: ../shared/flutter/along_map
  along_realtime:
    path: ../shared/flutter/along_realtime
  app_links: 6.4.1
  camera: 0.11.2
  connectivity_plus: 6.1.4
  flutter:
    sdk: flutter
  flutter_tts: 4.2.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 9.2.4
  flutter_svg: 2.0.17
  go_router: 15.1.2
  google_mlkit_text_recognition: 0.15.1
  maplibre_gl: 0.22.0
  path_provider: 2.1.5
  permission_handler: 11.4.0
  sentry_flutter: 8.14.2
  supabase_flutter: 2.8.4
  url_launcher: 6.3.1

  intl: any
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: 3.14.1

flutter:
  # iOS native deps are pinned by ios/Podfile.lock. Flutter's SwiftPM default
  # resolves plugin packages by range instead (sentry-cocoa "from: 8.46.0" pulls a
  # newer 8.x that sentry_flutter 8.14.2 does not compile against).
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true

patrol:
  app_name: Along Rider
  android:
    package_name: ng.along.rider.dev
  ios:
    bundle_id: ng.along.rider.dev
