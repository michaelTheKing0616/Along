openapi: 3.1.0
info:
  title: Along Edge Functions
  version: 0.1.0
  description: |
    Machine-readable contract for Supabase Edge Functions (doc 03).
    Source of truth: docs/blueprint/03_api_contracts.md — keep in sync via CI.
servers:
  - url: /functions/v1
    description: Supabase Edge Functions base path
tags:
  - name: planning
    description: Trip planning and geocoding (Tier A)
  - name: payments
    description: Payments and settlement
  - name: webhooks
    description: Provider webhooks (service role)
paths:
  /plan-trip:
    post:
      operationId: planTrip
      tags: [planning]
      summary: Generate trip plan candidates (Tier A)
      description: Rate limit 30/min per user (doc 03 §0).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanTripRequest'
      responses:
        '200':
          description: Plan candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanTripSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /places-search:
    post:
      operationId: placesSearch
      tags: [planning]
      summary: Search parks, stages, and places (Tier A)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacesSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacesSearchSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /walking-directions:
    post:
      operationId: walkingDirections
      tags: [planning]
      summary: OSRM foot walking directions (Tier A)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingDirectionsRequest'
      responses:
        '200':
          description: Walking route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingDirectionsSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /parse-itinerary:
    post:
      operationId: parseItinerary
      tags: [planning]
      summary: Parse natural-language itinerary (Tier A)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseItineraryRequest'
      responses:
        '200':
          description: Parsed proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseItinerarySuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /settlement/initiate:
    post:
      operationId: settlementInitiate
      tags: [payments]
      summary: Initiate driver settlement (Tier I own)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementInitiateRequest'
      responses:
        '200':
          description: Settlement channel details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementInitiateSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /webhooks/paystack:
    post:
      operationId: webhooksPaystack
      tags: [webhooks]
      summary: Paystack webhook receiver (service)
      description: Verifies x-paystack-signature HMAC-SHA512; always 200 after signature check.
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
  /payments/initiate:
    post:
      operationId: paymentsInitiate
      tags: [payments]
      summary: Initiate rider/web payment (Tier B rider / Tier A web)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentsInitiateRequest'
      responses:
        '200':
          description: Payment channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsInitiateSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /qr/resolve/{driver_code}:
    get:
      operationId: qrResolve
      tags: [payments]
      summary: Resolve QR driver code (Tier A)
      description: Rate limit 30/min/IP; auth optional.
      parameters:
        - name: driver_code
          in: path
          required: true
          schema:
            type: string
        - name: t
          in: query
          required: false
          schema:
            type: string
            description: Optional signed token
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Resolved driver context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrResolveSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /payments/methods:
    post:
      operationId: paymentsMethods
      tags: [payments]
      summary: Add/remove/default saved payment method (Tier B rider)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentsMethodsRequest'
      responses:
        '200':
          description: Updated methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsMethodsSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /payments/receipt/{payment_id}:
    get:
      operationId: paymentsReceipt
      tags: [payments]
      summary: Itemised payment receipt (Tier B own / Tier A web token)
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: payer_phone_e164
          in: query
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsReceiptSuccessEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT; role derived server-side (doc 03 §0).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Mutating Edge Functions accept Idempotency-Key (24 h replay window).
  responses:
    ErrorResponse:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Point:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    FareTier:
      type: integer
      enum: [0, 1, 2, 3]
    FareComponent:
      type: object
      required: [kind, amount, label]
      properties:
        kind:
          type: string
          enum: [through_fare, leg, profile, estimate, load_surcharge, negotiated]
        ref_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        label:
          type: string
    Fare:
      type: object
      required: [total, tier, confidence, unconfirmed, components, quote_id, expires_at]
      properties:
        total:
          $ref: '#/components/schemas/Money'
        tier:
          $ref: '#/components/schemas/FareTier'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        unconfirmed:
          type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/FareComponent'
        quote_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    ModeRef:
      type: object
      required: [code, label, icon_key, color_token]
      properties:
        code:
          type: string
        label:
          type: string
        icon_key:
          type: string
        color_token:
          type: string
    Metrics:
      type: object
      required:
        - total_fare
        - total_time_s
        - in_vehicle_s
        - wait_s
        - walk_s
        - transfer_count
        - total_walking_distance_m
        - strenuousness_score
        - recommended_score
        - explain
      properties:
        total_fare:
          $ref: '#/components/schemas/Money'
        total_time_s:
          type: integer
          minimum: 0
        in_vehicle_s:
          type: integer
          minimum: 0
        wait_s:
          type: integer
          minimum: 0
        walk_s:
          type: integer
          minimum: 0
        transfer_count:
          type: integer
          minimum: 0
        total_walking_distance_m:
          type: integer
          minimum: 0
        strenuousness_score:
          type: number
          minimum: 0
        recommended_score:
          type: number
        explain:
          type: object
          additionalProperties:
            type: number
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION
        - CONFLICT
        - RATE_LIMITED
        - STATE_INVALID
        - DRIVER_NOT_MATCHABLE
        - LEDGER_BLOCKED
        - CANDIDATE_EXPIRED
        - NEGOTIATION_CLOSED
        - FARE_UNRESOLVED
        - COVERAGE_GAP
        - DEGRADED_UPSTREAM
        - IDEMPOTENT_REPLAY
    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
        degraded:
          type: boolean
        next_cursor:
          type: string
        idempotent_replay:
          type: boolean
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details: {}
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PlanTripRequest:
      type: object
      required: [origin, destination, filters, session_id]
      properties:
        origin:
          $ref: '#/components/schemas/Point'
        destination:
          $ref: '#/components/schemas/Point'
        destination_label:
          type: string
        filters:
          type: object
          required: [women_only, load]
          properties:
            women_only:
              type: boolean
            load:
              type: object
              required: [flagged]
              properties:
                flagged:
                  type: boolean
                size:
                  type: string
                  enum: [small, medium, large]
            modes:
              type: [array, 'null']
              items:
                type: string
        session_id:
          type: string
          format: uuid
        itinerary_stop_id:
          type: [string, 'null']
          format: uuid
    PlanCandidateLeg:
      type: object
      required:
        - leg_index
        - mode
        - board
        - alight
        - route_id
        - route_leg_ids
        - in_vehicle_s
        - wait_s
        - fare
        - supply
      properties:
        leg_index:
          type: integer
          minimum: 0
        mode:
          $ref: '#/components/schemas/ModeRef'
        board:
          type: object
        alight:
          type: object
        route_id:
          type: string
          format: uuid
        route_leg_ids:
          type: array
          items:
            type: string
            format: uuid
        in_vehicle_s:
          type: integer
          minimum: 0
        wait_s:
          type: integer
          minimum: 0
        fare:
          $ref: '#/components/schemas/Fare'
        supply:
          type: object
        load_warning:
          type: [object, 'null']
    PlanCandidate:
      type: object
      required: [candidate_id, kind, source, viable_direct, legs, metrics]
      properties:
        candidate_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [direct, multi_leg]
        source:
          type: string
          enum: [parked, roaming, driver_profile, graph]
        viable_direct:
          type: boolean
        legs:
          type: array
          items:
            $ref: '#/components/schemas/PlanCandidateLeg'
        transfers:
          type: array
          items:
            type: object
        metrics:
          $ref: '#/components/schemas/Metrics'
    PlanTripData:
      type: object
      required: [query_id, city_id, degraded, candidates, sort_orders]
      properties:
        query_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        degraded:
          type: boolean
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/PlanCandidate'
        sort_orders:
          type: object
          required: [recommended, cheapest, fastest, least_strenuous]
          properties:
            recommended:
              type: array
              items:
                type: string
                format: uuid
            cheapest:
              type: array
              items:
                type: string
                format: uuid
            fastest:
              type: array
              items:
                type: string
                format: uuid
            least_strenuous:
              type: array
              items:
                type: string
                format: uuid
        coverage_gap:
          type: [object, 'null']
    PlanTripSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PlanTripData'
    PlacesSearchRequest:
      type: object
      required: [q, near, city_id, limit]
      properties:
        q:
          type: string
          minLength: 2
        near:
          $ref: '#/components/schemas/Point'
        city_id:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 8
    PlaceResult:
      type: object
      required: [kind, name, area, location, distance_m]
      properties:
        kind:
          type: string
          enum: [park, stage, place]
        id:
          type: string
          format: uuid
        name:
          type: string
        area:
          type: string
        location:
          $ref: '#/components/schemas/Point'
        distance_m:
          type: number
          minimum: 0
    PlacesSearchData:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PlaceResult'
    PlacesSearchSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PlacesSearchData'
    WalkingDirectionsRequest:
      type: object
      required: [from, to, mode_pref]
      properties:
        from:
          $ref: '#/components/schemas/Point'
        to:
          $ref: '#/components/schemas/Point'
        mode_pref:
          type: string
          enum: [text, map, audio]
    WalkingStep:
      type: object
      required: [instruction, distance_m, bearing, maneuver, geometry]
      properties:
        instruction:
          type: string
        distance_m:
          type: number
          minimum: 0
        bearing:
          type: number
        maneuver:
          type: string
        geometry:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    WalkingDirectionsData:
      type: object
      required: [distance_m, duration_s, steps, polyline]
      properties:
        distance_m:
          type: number
          minimum: 0
        duration_s:
          type: integer
          minimum: 0
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WalkingStep'
        polyline:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        tts_script:
          type: array
          items:
            type: string
    WalkingDirectionsSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WalkingDirectionsData'
    ParseItineraryRequest:
      type: object
      required: [text, city_id]
      properties:
        text:
          type: string
          minLength: 3
        city_id:
          type: string
          format: uuid
        voice_transcript_id:
          type: string
          format: uuid
    ParseItineraryProposalItem:
      type: object
      required: [sequence, destination_description, resolved]
      properties:
        sequence:
          type: integer
          minimum: 1
        destination_description:
          type: string
        resolved:
          oneOf:
            - type: 'null'
            - type: object
              required: [label, location, confidence]
              properties:
                label:
                  type: string
                location:
                  $ref: '#/components/schemas/Point'
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
    ParseItineraryData:
      type: object
      required: [proposal, needs_confirmation]
      properties:
        proposal:
          type: array
          items:
            $ref: '#/components/schemas/ParseItineraryProposalItem'
        needs_confirmation:
          type: boolean
    ParseItinerarySuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ParseItineraryData'
    SettlementInitiateRequest:
      type: object
      required: [amount, channel]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        channel:
          type: string
          enum: [paystack_transfer, paystack_ussd, paystack_card]
    SettlementInitiateData:
      type: object
      required: [settlement_id, expires_at]
      properties:
        settlement_id:
          type: string
          format: uuid
        authorization_url:
          type: string
          format: uri
        ussd_code:
          type: string
        bank_account:
          type: object
        expires_at:
          type: string
          format: date-time
    SettlementInitiateSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SettlementInitiateData'
    PaymentsInitiateRequest:
      type: object
      required: [driver_code, channel]
      properties:
        driver_code:
          type: string
        trip_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        token:
          type: string
        method_pref:
          type: string
        channel:
          type: string
          enum: [app, web]
        payer_phone:
          type: string
        confirm_other_driver:
          type: boolean
    PaymentsInitiateData:
      type: object
      required: [payment_id, expires_at]
      properties:
        payment_id:
          type: string
          format: uuid
        authorization_url:
          type: string
          format: uri
        transfer_account:
          type: object
        ussd_code:
          type: string
        expires_at:
          type: string
          format: date-time
    PaymentsInitiateSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaymentsInitiateData'
    QrResolveData:
      type: object
      properties:
        driver:
          type: object
          properties:
            first_name:
              type: string
            plate:
              type: string
            mode:
              type: string
            accepts_digital:
              type: boolean
            active:
              type: boolean
        context:
          type: object
          properties:
            trip_id:
              type: string
              format: uuid
            amount:
              $ref: '#/components/schemas/Money'
            label:
              type: string
            locked:
              type: boolean
        suggested_amounts:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        warning:
          type: string
          enum: [different_driver]
    QrResolveSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/QrResolveData'
    PaymentsMethodsRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [add, remove, default]
        authorization_code:
          type: string
        payment_method_id:
          type: string
          format: uuid
    PaymentMethodSummary:
      type: object
      required: [id, brand, last4, is_default]
      properties:
        id:
          type: string
          format: uuid
        brand:
          type: string
        last4:
          type: string
        is_default:
          type: boolean
    PaymentsMethodsData:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodSummary'
    PaymentsMethodsSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaymentsMethodsData'
    PaymentsReceiptData:
      type: object
      required: [payment_id, amount, commission, driver_amount, source, paid_at]
      properties:
        payment_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        commission:
          $ref: '#/components/schemas/Money'
        driver_amount:
          $ref: '#/components/schemas/Money'
        source:
          type: string
        trip_id:
          type: string
          format: uuid
        paid_at:
          type: string
          format: date-time
    PaymentsReceiptSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaymentsReceiptData'
