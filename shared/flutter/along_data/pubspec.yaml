version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  along_core:
    path: ../along_core
  connectivity_plus: 6.1.4
  dio: 5.8.0+1
  drift: 2.20.3
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  path: 1.9.1
  path_provider: 2.1.5
  sqlite3_flutter_libs: 0.5.28
  supabase_flutter: 2.8.4

dev_dependencies:
  build_runner: 2.4.12
  drift_dev: 2.20.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
