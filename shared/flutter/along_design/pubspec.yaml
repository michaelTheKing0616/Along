name: along_design
description: Design tokens and shared UI components for Along.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  along_core:
    path: ../along_core
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  lottie: ^3.6.1
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/icons/android/mipmap-mdpi/
    - assets/icons/android/mipmap-hdpi/
    - assets/icons/android/mipmap-xhdpi/
    - assets/icons/android/mipmap-xxhdpi/
    - assets/icons/android/mipmap-xxxhdpi/
    - assets/icons/android/mipmap-anydpi-v26/
    - assets/icons/android/drawable-mdpi/
    - assets/icons/android/drawable-hdpi/
    - assets/icons/android/drawable-xhdpi/
    - assets/icons/android/drawable-xxhdpi/
    - assets/icons/android/drawable-xxxhdpi/
    - assets/icons/ios/AppIcon.appiconset/
    - assets/splash/
    - assets/map/
    - assets/map/tiles/light/
    - assets/map/tiles/dark/
    - assets/map/tiles/heat/
    - assets/photos/
    - assets/avatars/
    - assets/vehicles/
    - assets/motion/
  fonts:
    - family: Geist
      fonts:
        # Variable font (wght 100–900). The min/max pair is what lets
        # fontWeight resolve inside the axis instead of pinning 400.
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 100
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 900
    - family: Inter
      fonts:
        # Variable font (wght 100–900); min/max entries enable weight interpolation.
        - asset: assets/fonts/Inter.ttf
          weight: 100
        - asset: assets/fonts/Inter.ttf
          weight: 900
        # Static ExtraBold (w800) instantiated from the variable master at opsz 32
        # so display.xl (40px, w800) resolves without variable-axis fallback gaps.
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
